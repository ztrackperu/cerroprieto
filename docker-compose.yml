services:
  web:
    build: .
    container_name: cerroprieto-web
    ports:
      - "8080:80"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: zgroupot
      DB_USER: cerroprieto
      DB_PASS: cerroprieto
      BASE_URL: http://localhost:8080/
      URLAPI: ${URLAPI:-}
      URLAPI_MYSQL: ${URLAPI_MYSQL:-}
      URLAPI_MONGO: ${URLAPI_MONGO:-}
      URLAPI_MONGO2: ${URLAPI_MONGO2:-}
      URL_NUEVA: ${URL_NUEVA:-}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: cerroprieto-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zgroupot
      MYSQL_USER: cerroprieto
      MYSQL_PASSWORD: cerroprieto
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Assets/bd/base.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
